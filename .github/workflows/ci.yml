name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check js/app.js && node --check sw.js
      - name: Check compiled Tailwind CSS is up to date
        run: npm run build:css && git diff --exit-code css/tailwind.css
      - name: Run tests
        run: npm test
      - name: Run htmlhint
        run: npx --yes htmlhint index.html
